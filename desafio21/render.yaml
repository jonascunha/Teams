# Deploy no Render (https://render.com): New > Blueprint e aponte para este repositório.
services:
  - type: web
    name: desafio21
    runtime: node
    rootDir: desafio21
    plan: starter            # o disco persistente exige plano pago (~US$ 7/mês)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATA_DIR
        value: /var/data
      - key: JOIN_CODE
        value: MOOH21
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
